name: Isolated regression evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: python -m pip install -r project/backend/requirements.txt
      - name: Verify known baseline failures and passing fixed regression
        run: python -B run_all.py
      - name: Start real application and verify HTTP flows
        run: python -B test_project.py
      - name: Install frontend dependencies
        run: npm --prefix project/frontend ci --ignore-scripts --no-audit --no-fund
      - name: Build complete Vue frontend
        run: npm --prefix project/frontend run build
